<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTRY</title>
<style>
:root { --bg:#fafafa; --fg:#1c1c1e; --muted:#5f5f66; --line:#d0d0d6; --card:#fff; --warn:#b3261e; --ok:#1b7f3b; --s0:#1f5fbf; --s1:#c2571a; --s2:#6a6a70; --s3:#8a3fbf; }
@media (prefers-color-scheme: dark) { :root { --bg:#121214; --fg:#e8e8ea; --muted:#9a9aa2; --line:#2e2e34; --card:#1a1a1d; --warn:#ff8a80; --ok:#7bd88f; --s0:#6fa3ff; --s1:#ff9a5c; --s2:#a0a0a8; --s3:#c79bff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
main, header { max-width:1000px; margin:0 auto; padding:0 16px; }
header { padding-top:12px; padding-bottom:4px; }
nav { display:flex; flex-wrap:wrap; gap:4px 14px; margin:6px 0; }
nav a { color:var(--fg); text-decoration:none; padding:2px 0; border-bottom:2px solid transparent; }
nav a.on { border-bottom-color:var(--fg); font-weight:600; }
h1 { font-size:1.25rem; margin:8px 0; } h2 { font-size:1.05rem; margin:20px 0 6px; }
.muted { color:var(--muted); } .warn { color:var(--warn); } .ok { color:var(--ok); }
.bar { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; }
table { border-collapse:collapse; width:100%; background:var(--card); }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:.85rem; color:var(--muted); font-weight:600; }
.scroll { overflow-x:auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:10px 0; }
progress { width:100%; height:12px; }
select, input, button { font:inherit; padding:4px 8px; }
svg { width:100%; height:auto; background:var(--card); border:1px solid var(--line); }
.s0 { stroke:var(--s0); } .s1 { stroke:var(--s1); } .s2 { stroke:var(--s2); } .s3 { stroke:var(--s3); }
polyline { fill:none; stroke-width:2; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.key span { margin-right:14px; }

td, th { font-variant-numeric: tabular-nums; overflow-wrap:anywhere; }
caption { text-align:left; color:var(--muted); font-size:.85rem; padding:4px 0; caption-side:top; }
:focus-visible { outline:3px solid var(--s0); outline-offset:2px; }
.skip { position:absolute; left:-999px; } .skip:focus { left:8px; top:8px; background:var(--card); padding:6px 10px; z-index:9; }
.scroll { max-width:100%; }
.strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin:10px 0; padding:0; list-style:none; }
.strip li { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
.strip b { display:block; font-size:.8rem; color:var(--muted); font-weight:600; }
.strip .v { font-weight:700; }
.badge { display:inline-block; border:1px solid currentColor; border-radius:4px; padding:0 6px; font-size:.8rem; font-weight:700; }
.s1 { stroke-dasharray:7 3; } .s2 { stroke-dasharray:2 3; } .s3 { stroke-dasharray:9 3 2 3; }
.key svg { width:30px; height:10px; border:0; background:none; vertical-align:middle; margin-right:4px; }
.key span { white-space:nowrap; }
@media (max-width:520px) { .bar { align-items:flex-start; } nav { gap:2px 12px; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
<div class="bar"><strong>SENTRY</strong>
<span>
{% if version is defined %}
<form method="get" action="{{ path }}" style="display:inline">
<label class="muted">strategy version
<select name="v">
{% for v in versions %}<option value="{{ v }}" {% if v == version %}selected{% endif %}>{{ v }}</option>{% endfor %}
{% if not versions %}<option>none yet</option>{% endif %}
</select></label>
<button>Show</button>
</form>
<form method="post" action="/logout" style="display:inline"><button>Log out</button></form>
{% endif %}
</span></div>
{% if pages %}<nav aria-label="Pages">{% for href, label in pages %}<a href="{{ href }}{% if version %}?v={{ version }}{% endif %}" {% if href == path %}class="on" aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}</nav>{% endif %}
</header>
<main id="main">
{% block body %}{% endblock %}
<p class="muted">Read-only view. Every figure is scoped to the selected strategy version.</p>
</main>
</body>
</html>
