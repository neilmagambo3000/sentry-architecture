{% extends "base.html" %}
{% block body %}
<h1>Sign in</h1>
{% if error %}<p class="warn" role="alert">Wrong password.</p>{% endif %}
<form method="post" action="/login">
<p><label>Password<br><input type="password" name="password" autocomplete="current-password" autofocus required></label></p>
<button>Sign in</button>
</form>
{% endblock %}
